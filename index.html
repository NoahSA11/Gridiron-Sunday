<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A 3D broadcast-style football game with current NFL rosters for all 32 teams, playable on phone and desktop.">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.legend i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 900; }
.steps { margin: 6px 0 0; padding-left: 20px; font-size: 14px; line-height: 1.5; } .steps li { margin: 3px 0; }
/* tutorial / modals: scroll from the top on short screens, keep the button in view */
#tutorial .mcard, #pause .mcard { margin: auto 0; }
.tut .row { position: sticky; bottom: -20px; background: var(--chalk); padding: 10px 0 4px; margin-top: 8px; }
@media (max-height: 500px), (max-width: 560px) {
  .tut .steps { font-size: 13px; line-height: 1.4; } .tut p { font-size: 13px; } .legend { gap: 6px; } .legend span { font-size: 12px; } .legend i { width: 22px; height: 22px; }
  .tut .card-head { margin: 8px 0 4px; } .mcard { padding: 2px 14px 14px; }
}
/* portrait phones */
.portrait #bug { transform: translateX(-50%) scale(.62); transform-origin: 50% 100%; }
.portrait #ticker { bottom: calc(40px + env(safe-area-inset-bottom, 0px)); max-width: 94vw; }
.portrait #ticker span { font-size: 12px; }
.portrait .datachip { display: none; }
.portrait #hint { top: calc(56px + env(safe-area-inset-top, 0px)); font-size: 12px; }
.portrait .tb.pill { top: calc(92px + env(safe-area-inset-top, 0px)); height: 30px; }
.portrait .tb.pill b { font-size: 12px; }
.portrait .tb.main { width: 74px; height: 74px; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); }
.portrait .tb.r1 { width: 56px; height: 56px; right: calc(98px + env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
.portrait .tb.r2 { width: 56px; height: 56px; right: calc(96px + env(safe-area-inset-right, 0px)); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
.portrait .tb.r3 { width: 56px; height: 56px; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.portrait .tb.r4 { width: 52px; height: 52px; right: calc(160px + env(safe-area-inset-right, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.portrait .tb b { font-size: 13px; } .portrait .tb.main b { font-size: 16px; }
.portrait #stickZone { top: 40%; width: 50%; } .portrait #stickBase { left: 30%; top: 60%; width: 110px; height: 110px; margin: -55px 0 0 -55px; }
.portrait .banner .b1 span { font-size: 40px; } .portrait .banner.td .b1 span { font-size: 52px; }
.portrait .mode-touch .badge i, .portrait .badge i { width: 36px; height: 36px; font-size: 18px; }
.portrait .badge span, .portrait .badge em { font-size: 9px; }
</style>
<title>Gridiron Sunday</title>
<meta name="theme-color" content="#0E1B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
</head>
<body>
<style>
/* Layout concept: a live 3D broadcast underneath; slanted chyron panels and a
   chalk-white scorebug on top, like a Sunday-afternoon TV package.
   Single look by design (bright day game), colors set explicitly. */
:root {
  --chalk: #F2F4EE;      /* paper / panels */
  --ink: #0E1B2C;        /* navy broadcast ink */
  --turf: #2F7A3A;       /* field green */
  --gold: #FFC83D;       /* first-down-line yellow (primary accent) */
  --cobalt: #1F4FD8;     /* broadcast blue (secondary accent) */
  --flag: #E4372C;       /* penalty-flag red */
  --steel: #5F6B7A;      /* muted text, hue-biased to ink */
  --line: #C9CFD6;
  --display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--ink); font-family: var(--ui); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
button { font-family: var(--ui); cursor: pointer; color: inherit; }
button:focus-visible, .tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
kbd { font-family: var(--ui); font-weight: 700; background: var(--chalk); color: var(--ink); border-radius: 2px; padding: 0 5px; font-size: 0.85em; box-shadow: 0 2px 0 var(--steel); }
.muted { color: var(--steel); } .small { font-size: 12px; } .fine { font-size: 13px; color: var(--steel); max-width: 60ch; line-height: 1.45; }

/* ---------- buttons: slanted chyron blocks ---------- */
.btn { position: relative; border: 0; background: var(--chalk); color: var(--ink); padding: 12px 26px; transform: skewX(-12deg); font-weight: 700; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .12s; border: 2px solid var(--ink); }
.btn > span { display: inline-block; transform: skewX(12deg); }
.btn:hover { transform: skewX(-12deg) translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.btn:active { transform: skewX(-12deg) translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.gold { background: var(--gold); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: none; }
.btn.big { font-family: var(--display); font-size: 26px; font-weight: 800; padding: 10px 34px; letter-spacing: 0.04em; }
.btn.small { font-size: 13px; padding: 7px 14px; box-shadow: 3px 3px 0 var(--ink); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.chip { border: 2px solid var(--ink); background: var(--chalk); padding: 6px 12px; font-weight: 700; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.chip.on { background: var(--ink); color: var(--gold); }
.chip.ghost { background: transparent; }
.seg { display: inline-flex; border: 2px solid var(--ink); background: var(--chalk); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--gold); }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 14px; }
.card-head { display: inline-block; background: var(--ink); color: var(--gold); font-family: var(--display); font-weight: 800; letter-spacing: .12em; font-size: 15px; padding: 4px 14px 4px 10px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); margin: 14px 0 8px; }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; z-index: 20; }
.screen[hidden] { display: none; }
.s-title { background: linear-gradient(100deg, rgba(14,27,44,.92) 0%, rgba(14,27,44,.65) 42%, rgba(14,27,44,0) 70%); display: flex; align-items: center; }
.title-wrap { display: flex; gap: 32px; align-items: flex-end; justify-content: space-between; width: 100%; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
.title-left { min-width: 0; }
.chyron { display: inline-block; transform: skewX(-12deg); padding: 4px 14px; font-weight: 700; letter-spacing: .14em; font-size: 13px; }
.chyron > span { display: inline-block; transform: skewX(12deg); }
.chyron.gold { background: var(--gold); color: var(--ink); }
.logo { font-family: var(--display); font-weight: 900; color: var(--chalk); line-height: .82; margin: 10px 0 6px; font-size: clamp(56px, 11vw, 150px); letter-spacing: -0.01em; transform: skewX(-8deg); text-shadow: 6px 6px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; }
.logo .l2 { color: var(--gold); padding-left: .35em; }
.tagline { color: var(--chalk); font-size: 18px; margin: 4px 0 18px; opacity: .92; letter-spacing: .02em; }
.menu { display: flex; gap: 16px; flex-wrap: wrap; }
.title-card { background: var(--chalk); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 4px 18px 16px; max-width: 420px; min-width: 0; }
.rstatus { font-size: 14px; line-height: 1.45; margin: 6px 0; }
.rstatus .err { color: var(--flag); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--steel); margin-right: 6px; vertical-align: 1px; }
.dot.live, .dot.file { background: #23A455; } .dot.cache { background: var(--cobalt); } .dot.snapshot { background: var(--gold); box-shadow: 0 0 0 1.5px var(--ink); } .dot.placeholder { background: var(--flag); }

.panel { background: var(--chalk); min-height: 100%; max-width: 1280px; margin: 0 auto; padding: 0 0 24px; box-shadow: 0 0 0 100vmax rgba(14,27,44,.55); }
.bar { display: flex; align-items: center; gap: 16px; background: var(--ink); color: var(--chalk); padding: 10px 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 2; }
.bar h2 { font-family: var(--display); font-weight: 800; font-size: 28px; margin: 0; letter-spacing: .03em; text-transform: uppercase; }
.bar .muted { color: #AEB8C6; margin-left: auto; }
.back { background: transparent; border: 2px solid var(--gold); color: var(--gold); font-weight: 700; padding: 4px 12px; text-transform: uppercase; letter-spacing: .06em; }
.panel > :not(.bar) { margin-left: 16px; margin-right: 16px; }

/* team select */
.matchup { display: flex; gap: 18px; align-items: stretch; flex-wrap: wrap; margin-top: 16px; }
.slot { flex: 1 1 260px; min-width: 0; }
.slab { position: relative; background: var(--c1); color: #fff; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; column-gap: 12px; align-items: center; clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%); border-bottom: 6px solid var(--c2); }
.slab .lbl { grid-column: 1 / -1; font-weight: 700; font-size: 12px; letter-spacing: .14em; opacity: .9; }
.slab .tn { display: flex; flex-direction: column; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.slab .tn span { font-size: 15px; font-weight: 600; }
.slab .tn b { font-family: var(--display); font-size: 34px; font-weight: 900; line-height: .95; text-transform: uppercase; }
.slab .ovrs { grid-column: 1 / -1; display: flex; gap: 14px; font-size: 13px; margin-top: 6px; font-weight: 600; }
.slab .ovrs b { font-family: var(--display); font-size: 20px; }
.helm { filter: drop-shadow(2px 2px 0 rgba(0,0,0,.25)); }
.keyp { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; display: grid; gap: 2px; }
.keyp b { display: inline-block; width: 30px; color: var(--steel); }
.keyp i { font-style: normal; font-family: var(--display); font-weight: 800; float: right; }
.vs { display: flex; align-items: center; }
.go-col { display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: flex-start; }
.pickwho { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.grid32 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 14px; margin-top: 12px; }
.div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.dh { font-weight: 700; font-size: 12px; letter-spacing: .12em; color: var(--steel); text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 2px; }
.tile { position: relative; display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; border: 2px solid var(--ink); background: #fff; padding: 0 10px 0 0; height: 40px; text-align: left; overflow: hidden; }
.tile .ab { height: 100%; display: flex; align-items: center; justify-content: center; background: var(--c1); color: #fff; font-family: var(--display); font-weight: 900; font-size: 19px; border-right: 4px solid var(--c2); clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.tile .nm { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tile .ov { font-family: var(--display); font-weight: 800; font-size: 18px; }
.tile.sel-u { outline: 4px solid var(--gold); outline-offset: -1px; }
.tile.sel-o { outline: 4px solid var(--cobalt); outline-offset: -1px; }

/* settings */
.setgrid { display: grid; grid-template-columns: max-content 1fr; gap: 10px 18px; align-items: center; margin-top: 18px; }
.setgrid label { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; }
.setgrid .seg { justify-self: start; }
.filebtn { cursor: pointer; } .filebtn input { display: none; }
.formula { margin-top: 16px; max-width: 70ch; font-size: 14px; line-height: 1.5; }
.formula summary { font-weight: 700; cursor: pointer; }
code { background: #E2E6EA; padding: 0 4px; font-size: .92em; }

/* season */
.season-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; margin-top: 16px; }
.nextgame { background: var(--c1, var(--ink)); color: #fff; padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; border-bottom: 6px solid var(--c2, var(--gold)); }
.nextgame .lbl { grid-column: 1/-1; font-weight: 700; letter-spacing: .14em; font-size: 12px; }
.nextgame .tn { display: flex; flex-direction: column; } .nextgame .tn b { font-family: var(--display); font-size: 30px; font-weight: 900; text-transform: uppercase; line-height: .95; }
.nextgame .ovrs, .nextgame .btn, .nextgame .champ { grid-column: 1/-1; justify-self: start; }
.nextgame.done { background: var(--ink); }
.results { list-style: none; padding: 0; margin: 0; font-size: 14px; display: grid; gap: 3px; }
.results b { display: inline-block; width: 20px; } .rW { color: #23A455; } .rL { color: var(--flag); }
.seeds { margin: 0; padding-left: 20px; font-weight: 600; } .seeds .me { color: var(--cobalt); }
.standings { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; align-content: start; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.stand { width: 100%; font-size: 13px; }
.stand th { text-align: right; font-size: 11px; letter-spacing: .08em; color: var(--steel); border-bottom: 2px solid var(--ink); padding: 2px 4px; }
.stand th:first-child { text-align: left; color: var(--ink); }
.stand td { text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--line); }
.stand td:first-child { text-align: left; font-weight: 700; }
.stand tr.me td { background: #FFF0C2; }
td i, li i { display: inline-block; width: 8px; height: 14px; margin-right: 6px; vertical-align: -2px; transform: skewX(-12deg); }

/* play call */
.s-playcall { background: rgba(14,27,44,.55); padding-block: 0; }
.callwrap { max-width: 1280px; margin: 0 auto; background: var(--chalk); min-height: 100%; padding-bottom: 20px; }
.callbar { display: flex; align-items: stretch; background: var(--ink); color: var(--chalk); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
.callbar > div { display: flex; align-items: center; padding: 8px 14px; }
.cb-side { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: .06em; background: var(--cobalt); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); padding-right: 26px !important; }
.cb-side.def { background: var(--flag); }
.cb-sit { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--gold); letter-spacing: .03em; }
.cb-clock { font-weight: 700; font-variant-numeric: tabular-nums; }
.cb-act { margin-left: auto; }
.cb-act .btn.ghost { color: var(--chalk); border-color: var(--chalk); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px 0; }
.coach { margin: 8px 14px 0; font-size: 14px; } .coach b { background: var(--gold); padding: 0 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 10px 14px; }
.pcard { border: 2px solid var(--ink); background: #fff; padding: 0; text-align: left; display: flex; flex-direction: column; transition: transform .1s; box-shadow: 3px 3px 0 var(--ink); }
.pcard:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
.pcard canvas { width: 100%; height: auto; aspect-ratio: 170 / 104; display: block; max-width: 100%; }
.pcard .pc-t { padding: 5px 8px 7px; display: flex; flex-direction: column; min-width: 0; }
.pcard .pc-t b { font-family: var(--display); font-weight: 800; font-size: 18px; text-transform: uppercase; line-height: 1; }
.pcard .pc-t span { font-size: 12px; color: var(--steel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard.sug { outline: 4px solid var(--gold); outline-offset: -1px; }

/* modals */
.modal { min-height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(14,27,44,.6); margin: -16px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) -16px calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.mcard { background: var(--chalk); border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); padding: 4px 20px 20px; max-width: 520px; width: 100%; min-width: 0; }
.mcard.wide { max-width: 980px; }
.mcard h2 { font-family: var(--display); font-weight: 900; font-size: 34px; margin: 6px 0; text-transform: uppercase; line-height: 1; text-wrap: balance; }
.verdict { font-family: var(--display); font-size: 24px; font-weight: 800; margin: 0; } .verdict.win { color: #1D8A47; } .verdict.loss { color: var(--flag); }
.box { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 22px; margin-top: 10px; }
.box table { width: 100%; font-size: 14px; }
.box th { font-size: 11px; letter-spacing: .1em; color: var(--steel); text-align: right; border-bottom: 2px solid var(--ink); padding: 3px 6px; }
.box th:first-child { text-align: left; }
.box td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--line); }
.box td:first-child { text-align: left; font-weight: 600; }
.lines td b { font-family: var(--display); font-size: 20px; }
.leaders { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.leaders .lh { font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; border-bottom: 2px solid var(--ink); }
.leaders ul { list-style: none; padding: 0; margin: 4px 0 0; font-size: 13px; display: grid; gap: 3px; }
.tstats { grid-row: span 2; }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 8px 0 12px; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#hud[hidden] { display: none; }
#hud button { pointer-events: auto; }
.topbar { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; }
.datachip { font-size: 11px; font-weight: 700; letter-spacing: .1em; background: rgba(14,27,44,.75); color: var(--chalk); padding: 3px 8px; border-left: 4px solid var(--gold); }
.datachip.live, .datachip.file { border-left-color: #23A455; } .datachip.cache { border-left-color: var(--cobalt); } .datachip.placeholder { border-left-color: var(--flag); }
.iconbtn { margin-left: auto; width: 40px; height: 40px; border: 2px solid var(--ink); background: var(--chalk); font-weight: 900; font-size: 15px; box-shadow: 3px 3px 0 var(--ink); }
.iconbtn + .iconbtn { margin-left: 0; }
#bug { position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: stretch; height: 44px; box-shadow: 0 6px 18px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
.bt { position: relative; display: flex; align-items: center; gap: 10px; background: var(--c1); color: #fff; padding: 0 12px 0 10px; border-bottom: 4px solid var(--c2); min-width: 104px; }
.bt .ab { font-family: var(--display); font-weight: 900; font-size: 22px; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.bt .sc { font-family: var(--display); font-weight: 900; font-size: 30px; margin-left: auto; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.bt .to { position: absolute; left: 10px; bottom: 3px; display: flex; gap: 3px; }
.bt .to i { width: 12px; height: 3px; background: rgba(255,255,255,.3); } .bt .to i.on { background: #fff; }
.bt.has::after { content: ""; position: absolute; top: 5px; right: 3px; width: 8px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 1.5px var(--ink); }
.bq { background: var(--chalk); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-weight: 700; }
.bq span { color: var(--steel); font-size: 13px; } .bq b { font-family: var(--display); font-size: 26px; font-weight: 800; }
.bd { background: var(--gold); display: flex; align-items: center; padding: 0 14px 0 12px; font-family: var(--display); font-weight: 900; font-size: 22px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); padding-right: 22px; white-space: nowrap; }
